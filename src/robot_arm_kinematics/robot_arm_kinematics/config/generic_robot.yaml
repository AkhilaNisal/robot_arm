robot:
  name: generic_robot
  dof: 6

  joint_names:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

  # Fixed transformation from base_link to DH frame 0
  base_transform:
    translation: [0.0, 0.0, 0.15]

  # Standard DH parameters
  # Lengths are in metres.
  # Angles are in degrees.
  dh_parameters:
    - {a: 0.00, alpha_deg: -90.0, d: 0.30, theta_offset_deg: 0.0}
    - {a: 0.25, alpha_deg:   0.0, d: 0.00, theta_offset_deg: -90.0}
    - {a: 0.00, alpha_deg:  90.0, d: 0.00, theta_offset_deg: 90.0}
    - {a: 0.00, alpha_deg: -90.0, d: 0.32, theta_offset_deg: 0.0}
    - {a: 0.00, alpha_deg:  90.0, d: 0.00, theta_offset_deg: 0.0}
    - {a: 0.00, alpha_deg:   0.0, d: 0.20, theta_offset_deg: 0.0}

  # Joint limits
  # Angles are in degrees.
  joint_limits:
    lower_deg: [-180.0, -114.59155902616465, -143.2394487827058, -180.0, -114.59155902616465, -180.0]
    upper_deg: [ 180.0,  114.59155902616465,  143.2394487827058,  180.0,  114.59155902616465,  180.0]

    # Maximum joint velocities (rad/s)
    velocity: [2.0, 2.0, 2.0, 3.0, 3.0, 3.0]