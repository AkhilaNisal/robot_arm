robot:
  name: gp7
  dof: 6
  joint_names: [joint_0, joint_1, joint_2, joint_3, joint_4, joint_5]

  # Standard DH model derived from the GP7 URDF joint-axis geometry.
  # DH angles are in degrees; distances are in metres. The base and tool
  # transforms align the DH frames with base_link and the GP7 TCP.
  base_transform:
    translation: [0.0, 0.0, 0.33]
    rotation_rpy_deg: [180.0, 0.0, -1.5]

  dh_parameters:
    - {a: 0.039986, alpha_deg: -89.99985, d: 0.0, theta_offset_deg: 0.0}
    - {a: 0.445, alpha_deg: 0.0, d: -0.0010471, theta_offset_deg: 90.0}
    - {a: 0.039, alpha_deg: -89.99985, d: 0.0, theta_offset_deg: 0.0002104}
    - {a: 0.0, alpha_deg: 89.99985, d: -0.43985, theta_offset_deg: 0.0}
    - {a: 0.0, alpha_deg: 89.99985, d: -0.011518, theta_offset_deg: -180.0}
    - {a: 0.0, alpha_deg: 0.0, d: 0.0, theta_offset_deg: 0.0}

  tool_transform:
    translation: [0.0, 0.0, -0.15]
    rotation_rpy_deg: [-180.0, 0.0, -180.0]

  joint_limits:
    lower_deg: [-170.0, -145.0, -70.0, -190.0, -135.0, -360.0]
    upper_deg: [170.0, 65.0, 190.0, 190.0, 135.0, 360.0]
    velocity: [6.54498, 5.49779, 7.15585, 9.59931, 9.59931, 17.4533]
